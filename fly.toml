# Configuración de despliegue en Fly.io — Hauscrete CRM
# La contraseña de acceso (ACCESO_PASS) se pone como secreto, NO aquí:
#   fly secrets set ACCESO_PASS="tu-contraseña"

app = "hauscrete-crm"
primary_region = "lax"   # Los Ángeles — la más cercana a Hermosillo y Mexicali (noroeste)

[build]

[env]
  PORT = "8080"
  DB_FILE = "/data/hauscrete.sqlite"

# Disco persistente donde vive la base de datos (no se borra al redeployar)
[[mounts]]
  source = "hauscrete_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
